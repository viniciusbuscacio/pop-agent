# Host-wide journal bound used by the self-hosted Pop Agent server.
# Install as /etc/systemd/journald.conf.d/50-pop-agent-retention.conf, then run:
#   sudo systemctl restart systemd-journald
#   sudo journalctl --vacuum-time=14d --vacuum-size=512M
#
# journald has no per-unit disk quota. Pop's service-level burst limit handles
# runaway output; these limits keep the shared host journal predictable.
[Journal]
SystemMaxUse=512M
MaxRetentionSec=14day
Compress=yes
