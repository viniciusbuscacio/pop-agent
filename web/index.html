<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#202020" />
    <meta name="description" content="Your own agent, on your own server." />
    <!-- iOS ignores the manifest icons and reads this one. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <title>Pop Agent</title>
    <script>
      // Applied before the first paint: reading the stored theme from React
      // would flash the wrong colours on every load.
      (function () {
        try {
          var stored = localStorage.getItem('pop-agent.theme') || 'system';
          var dark =
            stored === 'dark' ||
            (stored === 'system' && !window.matchMedia('(prefers-color-scheme: light)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (error) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
