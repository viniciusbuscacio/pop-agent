name: Bug report
description: Report a reproducible problem in Pop Agent
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. For vulnerabilities, stop here and follow [SECURITY.md](https://github.com/viniciusbuscacio/pop-agent/blob/main/SECURITY.md). Never include secrets or private data.
  - type: input
    id: version
    attributes:
      label: Pop Agent version or commit
      description: Use the tagged version or full commit hash when possible.
      placeholder: v0.2.41 or 0123456789abcdef...
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - Server / API
        - Browser PWA
        - Pop CLI
        - Pop Local Access
        - Installation / update
        - Documentation
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include relevant OS, architecture, browser, Node, and deployment details.
      placeholder: Debian 12 amd64, Node 22.19.0, Caddy, Firefox 136
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and impact.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide a minimal, repeatable sequence using synthetic data.
      placeholder: |
        1. Start ...
        2. Open ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      description: Optional. Remove tokens, credentials, private content, hostnames, and personal information before attaching anything.
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues and pull requests for this problem.
          required: true
        - label: This is not a security vulnerability.
          required: true
        - label: I removed all secrets, credentials, recovery material, private content, and personal information.
          required: true
