name: server-release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.0
          cache-dependency-path: local-access/tray/go.sum
      - name: Build and validate on the native architecture
        run: |
          ONNXRUNTIME_NODE_INSTALL_CUDA=skip npm ci
          npm run gate
          npm run pack:cli
          npm run pack:server-runtime -- "$RUNNER_TEMP/server-release"
      - name: Verify the downloaded installation path without development tools
        run: |
          mkdir -p "$RUNNER_TEMP/no-build-tools"
          for tool in npm npx go python python3 gcc g++ make; do
            printf '#!/bin/sh\necho "Unexpected build tool invocation" >&2\nexit 90\n' > "$RUNNER_TEMP/no-build-tools/$tool"
            chmod +x "$RUNNER_TEMP/no-build-tools/$tool"
          done
          PATH="$RUNNER_TEMP/no-build-tools:$PATH" POP_AGENT_SERVER_RELEASE_DIR="$RUNNER_TEMP/server-release" node tools/install-prebuilt.ts --verify-only --data-dir "$RUNNER_TEMP/probe-data" --workspace "$RUNNER_TEMP/probe-workspace"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: server-${{ matrix.runner }}
          path: ${{ runner.temp }}/server-release/pop-agent-*
          compression-level: 0
          retention-days: 3
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: server-*
          merge-multiple: true
          path: release
      - name: Publish immutable validated release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cat VERSION)
          test "$(find release -type f | wc -l)" -eq 4
          if gh release view "v$version" >/dev/null 2>&1; then
            echo 'This version already has a release; never replace its bytes.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "v$version" "$GITHUB_SHA" -m "Pop Agent $version"
          gh auth setup-git
          git push origin "refs/tags/v$version"
          gh release create "v$version" --target "$GITHUB_SHA" --draft --title "Pop Agent $version" --notes 'Prebuilt Ubuntu amd64 and arm64 server packages. Both native builds passed the full gate and production installation probes. FFmpeg and Whisper remain included in guided installation.'
          gh release upload "v$version" release/*
          gh release edit "v$version" --draft=false
